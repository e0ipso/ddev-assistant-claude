#ddev-generated
# Project-scoped, persistent Claude Code state, bind-mounted read-write. Because
# it's a live mount rather than a copy, writes made inside the container land
# directly in .ddev/claude-code/ on the host and survive
# `ddev restart`/`ddev poweroff` -- nothing is ever discarded between starts.
#
# Claude Code splits its state across two paths in $HOME: the ~/.claude/
# directory (history, sessions, credentials, config) and a sibling ~/.claude.json
# file (OAuth account/session identity -- machineID, userID, project trust
# state). Both are mounted here; mounting only the directory leaves
# ~/.claude.json ephemeral, so the container gets a fresh machine/session
# identity on every restart even though the credentials themselves persist.
#
# The mount targets are fixed paths rather than "${HOME}/.claude" /
# "${HOME}/.claude.json": ${HOME} is interpolated once, on the host, when
# docker-compose renders this file, so on hosts where the host home path
# differs from the container's (e.g. macOS's /Users/<user> vs. the container's
# /home/<user>) both sides of the mount would resolve to the host-style path.
# The post-start hook (config.assistant-claude.yaml) runs *inside* the
# container, where $HOME correctly resolves, and symlinks $HOME/.claude and
# $HOME/.claude.json to these fixed paths instead of relying on them directly
# here.
services:
  web:
    volumes:
      - "${DDEV_APPROOT}/.ddev/claude-code/.claude:/home/.claude-project-store"
      - "${DDEV_APPROOT}/.ddev/claude-code/.claude.json:/home/.claude-project-store.json"
