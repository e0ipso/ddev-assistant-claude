#ddev-generated
# Mount host Claude Code config read-only into the seed directory. The post-start
# hook mirrors it into the writable ~/.claude runtime directory on every start.
#
# The seed target is a fixed path rather than "${HOME}/.cred-seed/claude": ${HOME}
# is interpolated once, on the host, when docker-compose renders this file, so on
# hosts where the host home path differs from the container's (e.g. macOS's
# /Users/<user> vs. the container's /home/<user>) both sides of the mount would
# resolve to the host-style path. The post-start hook then runs *inside* the
# container, where $HOME correctly resolves to the container path, and never
# finds the seed. A fixed path sidesteps the mismatch on every host OS.
services:
  web:
    volumes:
      - "${HOME}/.claude:/home/.cred-seed/claude:ro"
